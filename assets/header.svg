<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="45%" stop-color="#111227" />
      <stop offset="100%" stop-color="#1A1230" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Text Shimmer Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-violet" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-rose" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .status-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
  </style>

  <!-- Base Card Background -->
  <rect x="6" y="6" width="888" height="308" rx="20" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.75" filter="url(#card-shadow)" />

  <!-- Ambient Light Overlays -->
  <rect x="6" y="6" width="888" height="308" rx="20" fill="url(#glow-violet)" />
  <rect x="6" y="6" width="888" height="308" rx="20" fill="url(#glow-rose)" />

  <!-- Subtle Architectural Wireframe Matrix Grid -->
  <g stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.08">
    <line x1="50" y1="6" x2="50" y2="314" />
    <line x1="150" y1="6" x2="150" y2="314" />
    <line x1="250" y1="6" x2="250" y2="314" />
    <line x1="350" y1="6" x2="350" y2="314" />
    <line x1="450" y1="6" x2="450" y2="314" />
    <line x1="550" y1="6" x2="550" y2="314" />
    <line x1="650" y1="6" x2="650" y2="314" />
    <line x1="750" y1="6" x2="750" y2="314" />
    <line x1="850" y1="6" x2="850" y2="314" />

    <line x1="6" y1="60" x2="894" y2="60" />
    <line x1="6" y1="120" x2="894" y2="120" />
    <line x1="6" y1="180" x2="894" y2="180" />
    <line x1="6" y1="240" x2="894" y2="240" />
  </g>

  <!-- Top Status Badge: Actively Seeking Roles -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="340" height="30" rx="15" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10B981" class="status-pulse" />
    <circle cx="16" cy="15" r="8" fill="#10B981" fill-opacity="0.25" />
    <text x="32" y="19" class="font-mono" font-size="11.5" font-weight="600" fill="#34D399" letter-spacing="0.5">ACTIVELY INTERVIEWING &#183; 2026 ROLES</text>
  </g>

  <!-- Top Right Location Marker -->
  <g transform="translate(685, 36)">
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#1E1B4B" fill-opacity="0.6" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" />
    <text x="16" y="19" class="font-mono" font-size="11" font-weight="500" fill="#C4B5FD">Rockville, MD (DC)</text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(50, 118)">
    <text x="0" y="0" class="font-sans" font-size="38" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.8">RENATA GABDRAKHMANOVA</text>
  </g>

  <!-- Subtitle with Gradient Emphasis -->
  <g transform="translate(50, 154)">
    <text x="0" y="0" class="font-sans" font-size="17" font-weight="600" fill="url(#accent-grad)" letter-spacing="0.2">
      Full-Stack Software Engineer &#183; 3D Spatial Designer &#183; CS @ UMGC '26
    </text>
  </g>

  <!-- Value Proposition / Mission Narrative -->
  <g transform="translate(50, 190)">
    <text x="0" y="0" class="font-sans" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
      Engineering resilient web systems and elegant spatial models. Bridging computer science rigor with
    </text>
    <text x="0" y="22" class="font-sans" font-size="13.5" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
      real-world client coordination, fiscal management, and pixel-precise human-centered design.
    </text>
  </g>

  <!-- Bottom Interactive Capability Pills -->
  <g transform="translate(50, 246)">
    <!-- Pill 1: Core Languages -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="34" rx="8" fill="#1E1E38" fill-opacity="0.75" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" class="font-mono" font-size="11.5" font-weight="600" fill="#DDD6FE">Java &#183; Python &#183; React &#183; JS/TS</text>
    </g>

    <!-- Pill 2: Architecture & CAD -->
    <g transform="translate(232, 0)">
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#1E1E38" fill-opacity="0.75" stroke="#F472B6" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" class="font-mono" font-size="11.5" font-weight="600" fill="#FBCFE8">3D CAD &#38; Spatial Modeling</text>
    </g>

    <!-- Pill 3: Full Stack Open Alum -->
    <g transform="translate(469, 0)">
      <rect x="0" y="0" width="190" height="34" rx="8" fill="#1E1E38" fill-opacity="0.75" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" class="font-mono" font-size="11.5" font-weight="600" fill="#BAE6FD">Full Stack Open Alum</text>
    </g>

    <!-- Pill 4: Open to Relocation -->
    <g transform="translate(671, 0)">
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1E1E38" fill-opacity="0.75" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="21" class="font-mono" font-size="11.5" font-weight="600" fill="#A7F3D0">Remote / Relo</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="100%">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0" />
      <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Line -->
  <line x1="20" y1="8" x2="880" y2="8" stroke="url(#divider-grad)" stroke-width="1.5" stroke-linecap="round" />
  <!-- Center Accent Rhombus / Spark -->
  <circle cx="450" cy="8" r="8" fill="url(#center-glow)" />
  <polygon points="450,4 454,8 450,12 446,8" fill="#FFFFFF" />
</svg>

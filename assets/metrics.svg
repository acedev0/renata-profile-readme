<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="100%">
  <defs>
    <linearGradient id="metric-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121F" />
      <stop offset="100%" stop-color="#0A0D17" />
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .font-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 800; }
    .font-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10.5px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.5px; }
  </style>

  <rect x="6" y="6" width="888" height="98" rx="14" fill="url(#metric-bg)" stroke="url(#border-glow)" stroke-width="1.2" />

  <!-- Metric 1 -->
  <g transform="translate(60, 24)">
    <text x="0" y="28" class="font-num" fill="#C4B5FD">2026</text>
    <text x="0" y="48" class="font-sub">UMGC CS GRADUATION</text>
  </g>

  <!-- Divider 1 -->
  <line x1="260" y1="20" x2="260" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 2 -->
  <g transform="translate(295, 24)">
    <text x="0" y="28" class="font-num" fill="#F472B6">3+ Years</text>
    <text x="0" y="48" class="font-sub">TECHNICAL &amp; CS EXPERIENCE</text>
  </g>

  <!-- Divider 2 -->
  <line x1="495" y1="20" x2="495" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 3 -->
  <g transform="translate(530, 24)">
    <text x="0" y="28" class="font-num" fill="#38BDF8">100%</text>
    <text x="0" y="48" class="font-sub">ON-TIME DELIVERY @ REMODELX</text>
  </g>

  <!-- Divider 3 -->
  <line x1="720" y1="20" x2="720" y2="85" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Metric 4 -->
  <g transform="translate(755, 24)">
    <text x="0" y="28" class="font-num" fill="#34D399">Dual-Threat</text>
    <text x="0" y="48" class="font-sub">FULL-STACK + 3D CAD</text>
  </g>
</svg>
